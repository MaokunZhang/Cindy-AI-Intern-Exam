name: PR dashboard tests
on:
  push:
    paths: ['plugins/my-pr-dashboard/**', '.github/workflows/pr-dashboard-tests.yml']
  pull_request:
    paths: ['plugins/my-pr-dashboard/**', '.github/workflows/pr-dashboard-tests.yml']
permissions:
  contents: read
jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test plugins/my-pr-dashboard/tests/core.test.cjs
